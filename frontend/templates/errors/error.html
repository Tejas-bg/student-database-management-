<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ code }} {{ title }} · GMU Management System</title><meta name="theme-color" content="#f8f6f0"><link rel="icon" href="{{ url_for('static', filename='img/branding/gmu-official-logo.jpg') }}" type="image/jpeg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/backend.css') }}"></head><body class="backend-page backend-page--centered"><main class="backend-error" id="main-content"><img src="{{ url_for('static', filename='img/branding/gmu-official-logo.jpg') }}"
         alt="GM University logo" width="64" height="64"><p class="backend-error__code">{{ code }}</p><h1>{{ title }}</h1><p>{{ message }}</p><div class="backend-actions">{% if session_user %}<a class="nx-btn nx-btn--primary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>{% else %}<a class="nx-btn nx-btn--primary" href="{{ url_for('auth.login') }}">Go to sign in</a>{% endif %}</div><p class="backend-footnote">GM University Management System</p></main></body></html>
